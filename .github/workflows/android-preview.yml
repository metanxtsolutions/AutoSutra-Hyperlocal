name: Android preview APK

# Builds the AutoSutra Android app: a Trusted Web Activity that opens the
# hosted web app full screen. Pushes that change android/ build an APK as a
# workflow artifact (a check that the project builds). Running the workflow by
# hand with a host also publishes the APK as a GitHub pre-release, which can be
# downloaded straight onto a phone.

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-preview.yml"
  workflow_dispatch:
    inputs:
      host:
        description: "Deployed site host name, e.g. autosutra-hyperlocal.vercel.app (blank: android/twa.properties)"
        required: false
        default: ""
      publish:
        description: "Publish the APK as a downloadable pre-release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing with the ANDROID_KEYSTORE_BASE64 secret." >> "$GITHUB_STEP_SUMMARY"
          else
            # No stored key: sign with a throwaway key. Fine for a preview, but each build has a
            # different signature, so uninstall the previous preview before installing a new one.
            PASS="$(openssl rand -hex 16)"
            echo "::add-mask::$PASS"
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/release.keystore" -storepass "$PASS" -keypass "$PASS" \
              -alias autosutra -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=AutoSutra Preview, O=AutoSutra, C=IN"
            echo "ANDROID_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "Signed with a throwaway preview key (no ANDROID_KEYSTORE_BASE64 secret)." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease -PtwaHost="${{ inputs.host }}" -PversionCode=${{ github.run_number }}

      - name: Collect APK and signing fingerprint
        run: |
          HOST="${{ inputs.host }}"
          if [ -z "$HOST" ]; then HOST="$(grep '^host=' android/twa.properties | cut -d= -f2)"; fi
          cp android/app/build/outputs/apk/release/app-release.apk autosutra-preview.apk
          FP="$(keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias autosutra | grep 'SHA256:' | awk '{print $2}')"
          echo "HOST=$HOST" >> "$GITHUB_ENV"
          echo "FINGERPRINT=$FP" >> "$GITHUB_ENV"
          {
            echo "### AutoSutra preview APK"
            echo "- Opens: https://$HOST"
            echo "- Signing SHA-256: \`$FP\`"
            echo "- For full screen without a browser bar, set ANDROID_APP_PACKAGE=in.autosutra.app.preview and ANDROID_APP_SHA256 to this fingerprint on the hosted site."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: autosutra-preview-apk
          path: autosutra-preview.apk
          retention-days: 14

      - name: Publish pre-release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-preview-${{ github.run_number }}"
          gh release create "$TAG" autosutra-preview.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "AutoSutra Android preview ${{ github.run_number }}" \
            --notes "Preview app for https://${HOST}. Demo data only.

          Install: open this page on your Android phone, download autosutra-preview.apk, open it and allow installing from your browser when asked. If an older preview is installed, uninstall it first.

          Signing certificate SHA-256: ${FINGERPRINT}"
