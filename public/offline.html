<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1b31">
<title>Offline · AutoSutra</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f7fb; color: #0f1b31;
         font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif; padding: 16px; }
  main { max-width: 360px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { color: #3a4f75; font-size: 15px; line-height: 1.5; margin: 0 0 20px; }
  button { height: 44px; padding: 0 20px; border: 0; border-radius: 8px; background: #f59e0b; color: #0a1222; font-weight: 600; font-size: 15px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You are offline</h1>
  <p>AutoSutra needs an internet connection. Your work is saved on the server, so nothing is lost.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
